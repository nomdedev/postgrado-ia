<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIN·LAB · versión de rescate del paso 5</title>
<style>
:root{--bg:#0B0F13;--panel:#111821;--line:#223040;--txt:#D8E1E9;--mut:#8394A5;--amb:#FFB020;--up:#2EBD85;--dn:#F6465D;--mono:ui-monospace,'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:14px;line-height:1.5}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line)}
header b{color:var(--amb);font-size:16px}
header span{color:var(--mut)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
nav button{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
nav button.on{color:var(--amb);border-color:var(--amb)}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{font-size:18px;margin-bottom:12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--mut)}
footer{padding:16px 20px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card small{display:block;color:var(--mut);font-size:11px}
.card b{font-size:20px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:var(--panel)}
.up{color:var(--up)}.dn{color:var(--dn)}.hot{color:var(--amb);font-weight:700}
.tag{padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
.COMPRA{background:rgba(46,189,133,.15);color:var(--up)}.VENTA{background:rgba(246,70,93,.15);color:var(--dn)}.NEUTRAL{background:rgba(255,176,32,.12);color:var(--amb)}
.btn{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
.btn.on,.btn.primary{background:var(--amb);color:#0B0F13;border-color:var(--amb)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px}
.note{color:var(--mut);font-size:12px;margin-top:8px}
.warn{color:var(--amb)}
pre{background:#0A0E13;border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto;font-size:12.5px;white-space:pre-wrap}
input,select{background:#0A0E13;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
input[type=range]{padding:0;width:160px;accent-color:var(--amb)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<script id="finlab-datos">
// ===== Datos simulados (paso 2). Funciones globales: se pueden probar desde la consola (F12). =====
var TICKERS = [
  { symbol: 'AAPL', name: 'Apple Inc.',               p0: 172, vol: 0.22, drift: 0.30, vBase: 52e6 },
  { symbol: 'MSFT', name: 'Microsoft Corp.',          p0: 375, vol: 0.20, drift: 0.18, vBase: 24e6 },
  { symbol: 'JNJ',  name: 'Johnson & Johnson',        p0: 147, vol: 0.13, drift: 0.02, vBase: 8e6 },
  { symbol: 'KO',   name: 'Coca-Cola Co.',            p0: 58,  vol: 0.11, drift: 0.08, vBase: 15e6 },
  { symbol: 'PG',   name: 'Procter & Gamble',         p0: 142, vol: 0.12, drift: 0.03, vBase: 7e6 },
  { symbol: 'GGAL', name: 'Grupo Financiero Galicia', p0: 39,  vol: 0.38, drift: 0.35, vBase: 2.4e6 },
  { symbol: 'YPF',  name: 'YPF S.A.',                 p0: 28,  vol: 0.55, drift: 0.05, vBase: 6e6 },
  { symbol: 'PAM',  name: 'Pampa Energía',            p0: 42,  vol: 0.34, drift: 0.25, vBase: 1.2e6 }
];

// Generador pseudoaleatorio con semilla: mismos números en cada recarga.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
// Normal estándar (Box-Muller)
function gauss(rng) { var u = 0, v = 0; while (u === 0) u = rng(); while (v === 0) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// Los últimos n días hábiles (lunes a viernes) que terminan hoy.
function businessDays(n, end) {
  var out = [], d = new Date(end || Date.now()); d.setHours(12, 0, 0, 0);
  while (out.length < n) { var wd = d.getDay(); if (wd !== 0 && wd !== 6) out.unshift(isoLocal(d)); d.setDate(d.getDate() - 1); }
  return out;
}
// Retorno diario = tendencia/252 + volatilidad/√252 · z
function simulateSeries(t, end) {
  var rng = mulberry32(hashStr(t.symbol)), price = t.p0;
  return businessDays(252, end).map(function (d) {
    var r = t.drift / 252 + t.vol / Math.sqrt(252) * gauss(rng);
    price = Math.max(0.5, price * (1 + r));
    return { d: d, c: +price.toFixed(2), v: Math.round(t.vBase * (0.6 + rng() * 0.9)) };
  });
}

// ===== Indicadores (paso 4) =====
// SMA: promedio simple de los últimos n cierres (null mientras no hay n datos).
function sma(p, n) { var out = [], s = 0; for (var i = 0; i < p.length; i++) { s += p[i]; if (i >= n) s -= p[i - n]; out.push(i >= n - 1 ? s / n : null); } return out; }
// EMA: alfa = 2/(n+1); arranca con la SMA de los primeros n.
function ema(p, n) { var out = [], k = 2 / (n + 1), e = null; for (var i = 0; i < p.length; i++) { if (i === n - 1) { e = p.slice(0, n).reduce(function (a, b) { return a + b; }, 0) / n; } else if (i >= n) { e = p[i] * k + e * (1 - k); } out.push(i >= n - 1 ? e : null); } return out; }
// RSI de Wilder: arranca con el promedio simple de 14 subas/bajas y después suaviza con alfa = 1/14.
function rsi(p, n) {
  n = n || 14; var out = [null], g = 0, l = 0;
  for (var i = 1; i < p.length; i++) {
    var d = p[i] - p[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; } }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; }
    out.push(i < n ? null : (l === 0 ? 100 : 100 - 100 / (1 + g / l)));
  }
  return out;
}
// COMPRA si SMA20 > SMA50 y EMA12 > EMA26; VENTA si ambas son menores; si no, NEUTRAL.
function signalOf(s20, s50, e12, e26) { var a = s20 > s50, b = e12 > e26; return a && b ? 'COMPRA' : (!a && !b ? 'VENTA' : 'NEUTRAL'); }

if (typeof window !== 'undefined') {
  console.table(TICKERS.map(function (t) {
    var s = simulateSeries(t);
    return { 'símbolo': t.symbol, 'primer cierre': s[0].c, 'último cierre': s[s.length - 1].c, 'var. año %': +((s[s.length - 1].c / s[0].c - 1) * 100).toFixed(2) };
  }));
}
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, Legend, PieChart, Pie, Cell } = Recharts;
const NOMBRE = 'FIN·LAB · rescate paso 5';
const fmt = (x, d = 2) => x == null ? '—' : x.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = x => (x > 0 ? '+' : '') + fmt(x) + ' %';

// Mercado: la ÚNICA fuente de números para tabla, gráfico y API.
const MARKET = TICKERS.map(t => {
  const serie = simulateSeries(t);
  const c = serie.map(x => x.c);
  const last = c[c.length - 1], prev = c[c.length - 2];
  const m = { ...t, serie, last, changePct: (last / prev - 1) * 100 };
  m.sma20 = sma(c, 20); m.sma50 = sma(c, 50); m.ema12 = ema(c, 12); m.ema26 = ema(c, 26); m.rsi14 = rsi(c, 14);
  m.signal = signalOf(m.sma20.at(-1), m.sma50.at(-1), m.ema12.at(-1), m.ema26.at(-1));
  return m;
});
const RANGOS = [['1M', 21], ['3M', 63], ['6M', 126], ['1A', 252]];

function Mercado() {
  const [sel, setSel] = useState(MARKET[0].symbol);
  const [rango, setRango] = useState(252);
  const suben = MARKET.filter(m => m.changePct > 0).length;
  const bajan = MARKET.filter(m => m.changePct < 0).length;
  const mayor = MARKET.reduce((a, b) => Math.abs(b.changePct) > Math.abs(a.changePct) ? b : a);
  const act = MARKET.find(m => m.symbol === sel);
  const datos = act.serie.map((x, i) => ({ d: x.d, c: x.c
    , sma20: act.sma20[i], sma50: act.sma50[i]
  })).slice(-rango);
  const exportar = () => {
    const vacio = x => x == null ? '' : x.toFixed(2);
    const filas = ['fecha,cierre,sma20,sma50,rsi14', ...act.serie.map((x, i) => [x.d, x.c.toFixed(2), vacio(act.sma20[i]), vacio(act.sma50[i]), vacio(act.rsi14[i])].join(','))];
    const url = URL.createObjectURL(new Blob([filas.join('\n')], { type: 'text/csv' }));
    const a = document.createElement('a'); a.href = url; a.download = `finlab-${act.symbol}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  return (
    <section>
      <h2>Mercado</h2>
      <div className="cards">
        <div className="card"><small>SUBEN HOY</small><b className="up">{suben}</b></div>
        <div className="card"><small>BAJAN HOY</small><b className="dn">{bajan}</b></div>
        <div className="card"><small>MAYOR MOVIMIENTO</small><b>{mayor.symbol} <span className={mayor.changePct >= 0 ? 'up' : 'dn'}>{pct(mayor.changePct)}</span></b></div>
      </div>
      <div className="scroll"><table>
        <thead><tr><th>SÍMBOLO</th><th>NOMBRE</th><th>PRECIO</th><th>VAR. DÍA</th>
          <th>RSI 14</th><th>SEÑAL</th>
          <th>30 DÍAS</th></tr></thead>
        <tbody>{MARKET.map(m => (
          <tr key={m.symbol} className={m.symbol === sel ? 'sel' : ''} onClick={() => setSel(m.symbol)}>
            <td><b>{m.symbol}</b></td><td>{m.name}</td><td>{fmt(m.last)}</td>
            <td className={m.changePct >= 0 ? 'up' : 'dn'}>{pct(m.changePct)}</td>
            <td className={m.rsi14.at(-1) > 70 || m.rsi14.at(-1) < 30 ? 'hot' : ''}>{fmt(m.rsi14.at(-1), 1)}</td>
            <td><span className={'tag ' + m.signal}>{m.signal}</span></td>
            <td><LineChart width={110} height={30} data={m.serie.slice(-30)}><Line type="monotone" dataKey="c" dot={false} stroke={m.changePct >= 0 ? '#2EBD85' : '#F6465D'} strokeWidth={1.5} isAnimationActive={false} /><YAxis hide domain={['dataMin', 'dataMax']} /></LineChart></td>
          </tr>))}</tbody>
      </table></div>
      <h3>{act.symbol} · {act.name}</h3>
      <div className="row">
        {RANGOS.map(([t, n]) => <button key={t} className={'btn' + (rango === n ? ' on' : '')} onClick={() => setRango(n)}>{t}</button>)}
        <button className="btn primary" onClick={exportar}>Exportar CSV</button>
      </div>
      <div style={{ height: 320 }}><ResponsiveContainer>
        <LineChart data={datos}>
          <XAxis dataKey="d" minTickGap={40} stroke="#8394A5" fontSize={11} />
          <YAxis domain={['auto', 'auto']} stroke="#8394A5" fontSize={11} width={60} />
          <Tooltip formatter={v => fmt(v)} contentStyle={{ background: '#111821', border: '1px solid #223040' }} />
          <Line type="monotone" dataKey="c" name="Precio" dot={false} stroke="#FFB020" isAnimationActive={false} />
          <Line type="monotone" dataKey="sma20" name="SMA20" dot={false} stroke="#4DC5B6" isAnimationActive={false} />
          <Line type="monotone" dataKey="sma50" name="SMA50" dot={false} stroke="#A78BFA" isAnimationActive={false} />
          <Legend />
        </LineChart>
      </ResponsiveContainer></div>
    </section>
  );
}

const RF = 0.043; // tasa libre de riesgo anual
const PRESETS = {
  Conservadora: { JNJ: 30, KO: 25, PG: 25, MSFT: 20 },
  Moderada: { AAPL: 20, MSFT: 20, KO: 15, JNJ: 15, GGAL: 15, PG: 15 },
  Agresiva: { GGAL: 30, YPF: 25, PAM: 20, AAPL: 15, MSFT: 10 }
};
const COLORES = ['#FFB020', '#4DC5B6', '#A78BFA', '#2EBD85', '#F6465D', '#60A5FA', '#F472B6', '#A3E635'];
// Retornos diarios simples de cada activo (251 por activo).
const RET = Object.fromEntries(MARKET.map(m => [m.symbol, m.serie.slice(1).map((x, i) => x.c / m.serie[i].c - 1)]));
const media = r => r.reduce((a, b) => a + b, 0) / r.length;
const cov = (a, b) => { const ma = media(a), mb = media(b); return a.reduce((s, x, i) => s + (x - ma) * (b[i] - mb), 0) / (a.length - 1); };
const VOL_INDIV = Object.fromEntries(MARKET.map(m => [m.symbol, Math.sqrt(cov(RET[m.symbol], RET[m.symbol]) * 252)]));

function analizar(w) {
  const syms = Object.keys(w).filter(s => w[s] > 0);
  const retorno = syms.reduce((a, s) => a + w[s] * media(RET[s]) * 252, 0);                  // media diaria × 252
  let varianza = 0;
  syms.forEach(s => syms.forEach(t => { varianza += w[s] * w[t] * cov(RET[s], RET[t]) * 252; })); // matriz de covarianzas × 252
  const vol = Math.sqrt(varianza);
  const n = RET[MARKET[0].symbol].length;
  let p = 100, b = 100, pico = 100, maxCaida = 0;
  const hist = [{ d: MARKET[0].serie[0].d, cartera: 100, equiponderada: 100 }];
  for (let k = 0; k < n; k++) {
    p *= 1 + syms.reduce((a, s) => a + w[s] * RET[s][k], 0);
    b *= 1 + MARKET.reduce((a, m) => a + RET[m.symbol][k] / MARKET.length, 0);
    pico = Math.max(pico, p); maxCaida = Math.min(maxCaida, p / pico - 1);
    hist.push({ d: MARKET[0].serie[k + 1].d, cartera: p, equiponderada: b });
  }
  return { retorno, vol, sharpe: (retorno - RF) / vol, maxCaida, hist };
}

function Carteras() {
  const [pesos, setPesos] = useState(() => ({ ...Object.fromEntries(TICKERS.map(t => [t.symbol, 0])), ...PRESETS.Conservadora }));
  const suma = Object.values(pesos).reduce((a, b) => a + b, 0);
  const w = Object.fromEntries(Object.entries(pesos).map(([s, x]) => [s, suma ? x / suma : 0])); // normalizados
  const r = useMemo(() => suma ? analizar(w) : null, [JSON.stringify(pesos)]);
  const torta = Object.entries(w).filter(([, x]) => x > 0).map(([name, value]) => ({ name, value: +(value * 100).toFixed(1) }));
  const elegir = nombre => setPesos({ ...Object.fromEntries(TICKERS.map(t => [t.symbol, 0])), ...PRESETS[nombre] });
  return (
    <section>
      <h2>Carteras</h2>
      <div className="row">{Object.keys(PRESETS).map(n => <button key={n} className="btn" onClick={() => elegir(n)}>{n}</button>)}</div>
      {suma !== 100 && suma > 0 && <p className="note warn">Los pesos suman {suma}%: se normalizaron para que sumen 100%.</p>}
      {!suma && <p className="note warn">Asigná algún peso para ver las métricas.</p>}
      <div className="scroll"><table>
        <thead><tr><th>ACTIVO</th><th>PESO</th><th></th><th>VOLATILIDAD INDIVIDUAL</th></tr></thead>
        <tbody>{TICKERS.map(t => (
          <tr key={t.symbol}><td><b>{t.symbol}</b></td>
            <td><input type="range" min="0" max="100" value={pesos[t.symbol]} aria-label={'Peso de ' + t.symbol} onChange={e => setPesos({ ...pesos, [t.symbol]: +e.target.value })} /></td>
            <td>{pesos[t.symbol]} %</td><td>{fmt(VOL_INDIV[t.symbol] * 100)} %</td></tr>))}</tbody>
      </table></div>
      {r && <>
        <div className="cards" style={{ marginTop: 16 }}>
          <div className="card"><small>RETORNO ANUAL</small><b>{fmt(r.retorno * 100)} %</b></div>
          <div className="card"><small>VOLATILIDAD</small><b>{fmt(r.vol * 100)} %</b></div>
          <div className="card"><small>SHARPE (RF 4,3 %)</small><b>{fmt(r.sharpe)}</b></div>
          <div className="card"><small>MÁXIMA CAÍDA</small><b className="dn">{fmt(r.maxCaida * 100)} %</b></div>
        </div>
        <p className="note">Por cada unidad de riesgo, esta cartera rinde {fmt(r.sharpe)} por encima de la tasa libre de riesgo.</p>
        <div className="row" style={{ alignItems: 'stretch' }}>
          <div style={{ width: 260, height: 240 }}><ResponsiveContainer><PieChart>
            <Pie data={torta} dataKey="value" nameKey="name" outerRadius={90} isAnimationActive={false} label={x => x.name}>
              {torta.map((x, i) => <Cell key={x.name} fill={COLORES[i % COLORES.length]} />)}</Pie>
            <Tooltip formatter={v => v + ' %'} /></PieChart></ResponsiveContainer></div>
          <div style={{ flex: 1, minWidth: 280, height: 240 }}><ResponsiveContainer><LineChart data={r.hist}>
            <XAxis dataKey="d" minTickGap={50} stroke="#8394A5" fontSize={11} /><YAxis domain={['auto', 'auto']} stroke="#8394A5" fontSize={11} />
            <Tooltip formatter={v => fmt(v)} contentStyle={{ background: '#111821', border: '1px solid #223040' }} /><Legend />
            <Line dataKey="cartera" name="Cartera (base 100)" dot={false} stroke="#FFB020" isAnimationActive={false} />
            <Line dataKey="equiponderada" name="Equiponderada" dot={false} stroke="#8394A5" isAnimationActive={false} />
          </LineChart></ResponsiveContainer></div>
        </div>
      </>}
    </section>
  );
}



const PESTANAS = [['mercado', '01 · Mercado'], ['carteras', '02 · Carteras'], ['python', '03 · Python & Colab'], ['api', '04 · API & Alertas']];
function EnConstruccion({ titulo }) { return <section><h2>{titulo}</h2><p className="note">En construcción</p></section>; }
function App() {
  const [tab, setTab] = useState('mercado');
  const hoy = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  const vista = {
    mercado: <Mercado />,
    carteras: <Carteras />,
    python: <EnConstruccion titulo="Python & Colab" />,
    api: <EnConstruccion titulo="API & Alertas" />,
  }[tab];
  return (
    <>
      <header><b>{NOMBRE}</b><span>{hoy}</span></header>
      <nav>{PESTANAS.map(([k, t]) => <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{t}</button>)}</nav>
      <main>{vista}</main>
      <footer>Datos simulados con fines educativos. No es asesoramiento financiero.</footer>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
