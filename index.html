<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIN·LAB — Terminal de Análisis · IA aplicada a Finanzas · UNLP</title>

<!-- Tipografías: Space Grotesk (titulares) + JetBrains Mono (datos, estilo terminal) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   FIN·LAB — Hoja de estilos (estética: terminal de trading oscura)
   Paleta: carbón + ámbar de terminal + verde/rojo semánticos
   ============================================================ */
:root{
  --bg:#0B0F13; --bg2:#0A0E13; --panel:#0F151D; --panel2:#121A23; --panel3:#0D131A;
  --line:#1D2A36; --line2:#28394A;
  --txt:#D8E1E9; --mut:#7E8FA0; --dim:#54677A;
  --amb:#FFB020; --amb-soft:rgba(255,176,32,.09);
  --up:#2EBD85; --up-soft:rgba(46,189,133,.10);
  --dn:#F6465D; --dn-soft:rgba(246,70,93,.10);
  --teal:#4DC5B6;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Space Grotesk',sans-serif;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F5F2; --bg2:#E8EDE9; --panel:#FFFFFF; --panel2:#F6F8F6; --panel3:#EDF1EE;
  --line:#CDD7D1; --line2:#AEBDB5;
  --txt:#1B2924; --mut:#52645C; --dim:#697B73;
  --amb:#A95D00; --amb-soft:rgba(169,93,0,.09);
  --up:#147454; --up-soft:rgba(20,116,84,.09);
  --dn:#C23B4B; --dn-soft:rgba(194,59,75,.08);
  --teal:#087A82;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background-color:var(--bg);
  /* grilla técnica de fondo, casi imperceptible: da textura de terminal */
  background-image:linear-gradient(rgba(126,143,160,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(126,143,160,.03) 1px,transparent 1px);
  background-size:38px 38px;
  color:var(--txt); font-family:var(--sans); font-size:14px;
  -webkit-font-smoothing:antialiased;
}
html[data-theme="light"] body{background-image:linear-gradient(rgba(60,87,74,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(60,87,74,.045) 1px,transparent 1px)}
html[data-theme="light"] .hd{background:rgba(242,245,242,.94)}
html[data-theme="light"] .brand-mark{background:var(--panel)}
html[data-theme="light"] .tt{background:#fff;box-shadow:0 6px 18px rgba(25,44,35,.14)}
html[data-theme="light"] .toast{background:#fff;box-shadow:0 8px 24px rgba(25,44,35,.16)}
html[data-theme="light"] .codebox,html[data-theme="light"] .curl,html[data-theme="light"] .guide-json{background:var(--bg2)}
html[data-theme="light"] .cln{color:#819087}
html[data-theme="light"] .tk-s{color:#277341}
html[data-theme="light"] .tk-c{color:#718179}
html[data-theme="light"] .tk-jb{color:#A24C12}
html[data-theme="light"] .corr-cell{border-color:rgba(60,87,74,.16)}
html[data-theme="light"] .corr-cell[style*="rgba(246,70,93"]{color:#762231}
html[data-theme="light"] .recharts-cartesian-grid line{stroke:#D5DED8!important}
html[data-theme="light"] .recharts-cartesian-axis line{stroke:#AEBDB5!important}
html[data-theme="light"] .recharts-cartesian-axis-tick-value{fill:#697B73!important}
html[data-theme="light"] .recharts-reference-line line{stroke:#AEBDB5!important}
::selection{background:var(--amb);color:#0B0F13}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:#22303E;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#2E4152}
a{color:var(--amb);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--mono);cursor:pointer}
input,select,textarea{font-family:var(--mono);color:var(--txt)}
:focus-visible{outline:1px solid var(--amb);outline-offset:2px}

/* ---------- Cabecera ---------- */
.hd{position:sticky;top:0;z-index:50;background:rgba(11,15,19,.93);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1440px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border:1px solid var(--line2);border-radius:6px;background:var(--panel3);display:flex;align-items:center;justify-content:center;color:var(--amb)}
.brand-name{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.1}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--mut);margin-top:3px}
.hd-right{display:flex;align-items:center;gap:14px}
.db-pill{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel3)}
.db-dot{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hd-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line2);color:var(--mut);border-radius:4px;padding:6px 11px;font-size:10px;letter-spacing:.08em;transition:.15s}
.hd-btn:hover{border-color:var(--amb);color:var(--amb)}
.hd-btn.confirm{border-color:var(--dn);color:var(--dn)}
.theme-btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:4px;padding:7px 10px;font:10px var(--mono);letter-spacing:.06em;white-space:nowrap}
.theme-btn:hover{border-color:var(--amb);color:var(--amb)}
.clock{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.06em;border-left:1px solid var(--line);padding-left:14px}
.clock b{color:var(--txt);font-weight:600}

/* ---------- Cinta de precios (marquee) ---------- */
.tape{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2);overflow:hidden;height:34px;display:flex;align-items:center}
.tape-track{display:flex;width:max-content;animation:tape 55s linear infinite;will-change:transform}
.tape:hover .tape-track{animation-play-state:paused}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape-item{display:inline-flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11px;padding:0 22px;border-right:1px solid var(--line);white-space:nowrap}
.tape-item .ti-sym{color:var(--dim);font-weight:600;letter-spacing:.08em}
.tape-item .ti-px{color:var(--txt)}
.tape-item .ti-chg{font-weight:600}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--mut)}

/* ---------- Navegación ---------- */
.nav{max-width:1440px;margin:0 auto;padding:0 28px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mut);padding:13px 16px;border-bottom:2px solid transparent;position:relative;transition:.15s}
.nav a:hover{color:var(--txt);text-decoration:none}
.nav a.on{color:var(--amb);border-bottom-color:var(--amb)}
.nav-dot{position:absolute;top:10px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--dn);animation:pulse 1.4s infinite}

/* ---------- Estructura general ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:30px 28px 70px}
.sec-head{display:flex;gap:18px;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.sec-num{font-family:var(--mono);font-size:34px;font-weight:700;color:transparent;-webkit-text-stroke:1px var(--amb);line-height:.9}
.sec-head h2{font-size:23px;font-weight:700;letter-spacing:.01em}
.sec-head p{color:var(--mut);font-size:13px;margin-top:5px;max-width:720px;line-height:1.55}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel3)}
.panel-t{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--mut);display:flex;align-items:center;gap:8px}
.panel-b{padding:16px 14px}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6}
.mono{font-family:var(--mono)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line2);color:var(--txt);border-radius:4px;padding:7px 13px;font-size:11px;letter-spacing:.06em;transition:.15s}
.btn:hover{border-color:var(--amb);color:var(--amb)}
.btn-primary{background:var(--amb);border-color:var(--amb);color:#0B0F13;font-weight:700}
.btn-primary:hover{background:#FFC24D;color:#0B0F13}
.btn-danger:hover{border-color:var(--dn);color:var(--dn)}
.btn-sm{padding:5px 9px;font-size:10px}
.btn.on{border-color:var(--amb);color:var(--amb);background:var(--amb-soft)}

/* ---------- Tablas ---------- */
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{font-family:var(--mono);font-size:12.5px;text-align:right;padding:9px 10px;border-bottom:1px solid rgba(29,42,54,.55);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
.row-click{cursor:pointer}
.row-click:hover{background:rgba(255,176,32,.045)}
.row-click.sel{background:var(--amb-soft);box-shadow:inset 2px 0 0 var(--amb)}
.sym-cell{display:flex;flex-direction:column;gap:1px}
.sym-cell b{font-size:12.5px;font-weight:700;letter-spacing:.05em}
.sym-cell span{font-family:var(--sans);font-size:9.5px;color:var(--dim);letter-spacing:.02em}

/* ---------- Badges de señal ---------- */
.sig{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:3px;border:1px solid}
.sig-COMPRA{color:var(--up);border-color:rgba(46,189,133,.55);background:var(--up-soft)}
.sig-VENTA{color:var(--dn);border-color:rgba(246,70,93,.55);background:var(--dn-soft)}
.sig-NEUTRAL{color:var(--mut);border-color:var(--line2);background:rgba(126,143,160,.06)}

/* ---------- Banda de estadísticas (métricas grandes) ---------- */
.statband{display:flex;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow-x:auto}
.stat{flex:1;min-width:130px;padding:14px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat-l{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);margin-bottom:7px}
.stat-v{font-family:var(--mono);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat-s{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:6px}

/* ---------- Layout de mercado ---------- */
.mkt-band{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:18px;overflow-x:auto}
.mkt-band .mb{padding:13px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:5px}
.mkt-band .mb:last-child{border-right:none;margin-left:auto}
.mb-l{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--dim)}
.mb-v{font-family:var(--mono);font-size:17px;font-weight:600}
.mkt-grid{display:grid;grid-template-columns:1fr 400px;gap:18px;align-items:start}
@media(max-width:1080px){.mkt-grid{grid-template-columns:1fr}}

/* Detalle del ticker */
.tk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:16px 18px 14px;flex-wrap:wrap}
.tk-id{display:flex;align-items:center;gap:14px}
.tk-sym{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:.03em}
.tk-name{font-size:12px;color:var(--mut);margin-top:2px}
.tk-px{text-align:right}
.tk-px .px{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.tk-px .chg{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:4px}
.mini-stats{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto}
.mini-stats .ms{padding:9px 16px;border-right:1px solid var(--line);text-align:right;min-width:88px}
.mini-stats .ms-l{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--dim)}
.mini-stats .ms-v{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-top:3px}
.chips{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:4px 9px;border:1px solid var(--line2);border-radius:3px;background:transparent;color:var(--mut);transition:.12s}
.chip .dot{width:8px;height:2px;border-radius:1px}
.chip.on{color:var(--txt);border-color:var(--line2);background:var(--panel2)}
.chip.off{opacity:.38}
.chart-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--dim);padding:8px 14px 0}

/* Tooltip de gráficos estilo terminal */
.tt{background:#0C1218;border:1px solid var(--line2);border-radius:4px;padding:9px 11px;font-family:var(--mono);font-size:11px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.tt-l{color:var(--dim);font-size:9.5px;letter-spacing:.1em;margin-bottom:6px}
.tt-r{display:flex;justify-content:space-between;gap:18px;padding:1.5px 0}
.tt-k{color:var(--mut)} .tt-v{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- Carteras ---------- */
.pf-grid{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
@media(max-width:1080px){.pf-grid{grid-template-columns:1fr}}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.wrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(29,42,54,.5)}
.wrow:last-child{border-bottom:none}
.wrow .wr-sym{font-family:var(--mono);font-size:12px;font-weight:700;width:52px}
.wrow .wr-name{font-size:10px;color:var(--dim);flex:1}
.wrow input[type=checkbox]{accent-color:var(--amb);width:14px;height:14px;cursor:pointer}
.wrow input[type=number]{width:66px;background:var(--bg2);border:1px solid var(--line2);border-radius:3px;padding:4px 6px;font-size:11.5px;text-align:right}
.wsum{font-family:var(--mono);font-size:11px;padding:10px 4px 0;color:var(--mut)}
.wsum.warn{color:var(--amb)}
.corr-cell{text-align:center;font-size:11px;padding:7px 6px;font-variant-numeric:tabular-nums;border:1px solid rgba(29,42,54,.4)}
.corr-th{font-size:10px;color:var(--mut);padding:7px 6px;text-align:center}
.rcbar{height:5px;background:var(--line);border-radius:2px;overflow:hidden;min-width:70px}
.rcbar i{display:block;height:100%;background:var(--amb);border-radius:2px}

/* ---------- Código Python / JSON ---------- */
.codebox{border:1px solid var(--line);border-radius:6px;background:var(--bg2);overflow:hidden}
.codebox-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel3)}
.codebox-t{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.codebox-h .acts{display:flex;gap:6px}
.codebox pre{padding:13px 0;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7}
.cl{display:flex;white-space:pre}
.cln{width:44px;flex:none;text-align:right;padding-right:14px;color:#33465A;user-select:none}
.tk-k{color:var(--amb);font-weight:600}
.tk-s{color:#7CE38B}
.tk-c{color:#54677A;font-style:italic}
.tk-n{color:var(--teal)}
.tk-jk{color:var(--amb)}
.tk-jb{color:#FF9E64}
.tk-jo{color:var(--mut)}
.expl{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:14px 16px}
.expl h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--amb);margin-bottom:12px}
.expl-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid rgba(29,42,54,.5);align-items:baseline}
.expl-row:last-child{border-bottom:none}
.expl-code{font-family:var(--mono);font-size:11px;color:var(--teal);flex:none;min-width:0;max-width:46%;overflow-wrap:break-word}
.expl-txt{font-size:12.5px;color:var(--mut);line-height:1.5}
.py-step{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:26px;align-items:start}
@media(max-width:1000px){.py-step{grid-template-columns:1fr}}
.py-step-h{display:flex;gap:14px;align-items:baseline;margin-bottom:12px}
.py-step-h .n{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amb);letter-spacing:.1em}
.py-step-h h3{font-size:17px}
.py-step-h .d{color:var(--mut);font-size:12.5px;margin-top:3px}

/* ---------- API / playground ---------- */
.api-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.api-grid{grid-template-columns:1fr}}
.ep{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;margin-bottom:12px}
.ep-h{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ep-m{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:3px}
.ep-m.GET{color:var(--teal);border:1px solid rgba(77,197,182,.5);background:rgba(77,197,182,.08)}
.ep-m.POST{color:var(--amb);border:1px solid rgba(255,176,32,.5);background:var(--amb-soft)}
.ep-m.DELETE{color:var(--dn);border:1px solid rgba(246,70,93,.5);background:var(--dn-soft)}
.ep-p{font-family:var(--mono);font-size:12.5px;font-weight:600}
.ep-d{font-size:12px;color:var(--mut);width:100%;line-height:1.5}
.ep-b{padding:12px 13px}
.curl{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-family:var(--mono);font-size:11px;color:var(--mut);overflow-x:auto;line-height:1.65;white-space:pre}
.curl b{color:var(--txt);font-weight:500}
.resp-h{display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;flex-wrap:wrap}
.resp-status{font-weight:700;letter-spacing:.08em}
.resp-status.ok{color:var(--up)} .resp-status.err{color:var(--dn)}
.resp-body{max-height:420px;overflow:auto;padding:12px 0}
.resp-body pre{font-family:var(--mono);font-size:11.5px;line-height:1.65}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim)}
.field select,.field input,.field textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;font-size:12px;min-width:120px}
.field textarea{width:100%;min-height:110px;resize:vertical;line-height:1.6;font-size:11.5px}
.alert-badge{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:3px;border:1px solid}
.alert-on{color:var(--dn);border-color:rgba(246,70,93,.6);background:var(--dn-soft);animation:blink 1.3s ease-in-out infinite}
.alert-off{color:var(--mut);border-color:var(--line2);background:rgba(126,143,160,.05)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.empty{padding:36px 20px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;line-height:1.8}

/* ---------- Toasts ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:#101820;border:1px solid var(--line2);border-left:2px solid var(--amb);border-radius:4px;padding:11px 15px;font-family:var(--mono);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .22s ease}
.toast.ok{border-left-color:var(--up)} .toast.err{border-left-color:var(--dn)}

<body>
<div id="root"></div>

<!-- React 18 + Babel (JSX sin build, ideal para clase) + Recharts -->
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/* ================================================================
   FIN·LAB · UNLP — Terminal de análisis de mercado y carteras
   Material didáctico · Posgrado de IA aplicada a Finanzas
   ----------------------------------------------------------------
   Arquitectura del archivo (de abajo hacia arriba):
     1) NÚCLEO DETERMINISTA  → PRNG con semilla fija (#42) + simulador
     2) BASE DE DATOS        → persistencia en localStorage
     3) BACKEND SIMULADO     → endpoints REST con contratos idénticos
                              a los que tendría un FastAPI real
     4) CÁLCULO FINANCIERO   → SMA, EMA, RSI, covarianzas, Sharpe…
     5) FRONTEND REACT       → UI + Recharts
   Todo con datos SIMULADOS y reproducibles: sin API keys externas.
   ================================================================ */

const {useState,useEffect,useMemo,useRef,useCallback} = React;
const {LineChart,Line,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,ReferenceLine,ReferenceArea} = Recharts;

/* ================================================================
   1) NÚCLEO DETERMINISTA — generación reproducible de datos
   ================================================================ */

const SEED_BASE = 42; // ← la semilla de toda la clase: cambiarla cambia el mundo

// PRNG mulberry32: rápido, suficiente y, sobre todo, DETERMINISTA
function mulberry32(a){
  return function(){
    a|=0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
// Hash simple de string → entero (para derivar una sub-semilla por ticker)
function hashStr(s){
  let h = 1779033703;
  for(let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  return h>>>0;
}
// Normal estándar vía Box-Muller (a partir de dos uniformes del PRNG)
function gauss(rng){
  let u=0,v=0;
  while(u===0)u=rng();
  while(v===0)v=rng();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

// Universo de activos de la clase (precios aproximados de referencia)
const TICKERS = [
  {symbol:'AAPL', name:'Apple Inc.',              p0:172, vol:0.22, vBase:52e6, drifts:[{until:1, d:0.38}]},
  {symbol:'MSFT', name:'Microsoft Corp.',         p0:375, vol:0.20, vBase:24e6, drifts:[{until:.45,d:0.30},{until:.75,d:-0.15},{until:1,d:0.28}]},
  {symbol:'JNJ',  name:'Johnson & Johnson',       p0:147, vol:0.13, vBase:8e6,  drifts:[{until:1, d:0.02}]},
  {symbol:'KO',   name:'Coca-Cola Co.',           p0:58,  vol:0.11, vBase:15e6, drifts:[{until:.6, d:0.06},{until:1,d:0.10}]},
  {symbol:'PG',   name:'Procter & Gamble',        p0:142, vol:0.12, vBase:7e6,  drifts:[{until:.5, d:-0.06},{until:1,d:0.09}]},
  {symbol:'GGAL', name:'Grupo Financiero Galicia',p0:39,  vol:0.38, vBase:2.4e6,drifts:[{until:.5, d:0.80},{until:.72,d:-0.40},{until:1,d:0.48}]},
  {symbol:'YPF',  name:'YPF S.A.',                p0:28,  vol:0.55, vBase:6e6,  drifts:[{until:.45,d:-0.35},{until:.8,d:-0.05},{until:1,d:0.45}]},
  {symbol:'PAM',  name:'Pampa Energía',           p0:42,  vol:0.34, vBase:1.2e6,drifts:[{until:.55,d:0.60},{until:.75,d:-0.25},{until:1,d:0.45}]},
];
const T_BY_SYM = Object.fromEntries(TICKERS.map(t=>[t.symbol,t]));

// Utilidades de fechas (solo días hábiles: lun a vie)
const iso = d => d.toISOString().slice(0,10);
function businessDaysBack(n, endStr){
  const out=[]; const d=new Date(endStr+'T12:00:00');
  while(out.length<n){
    const wd=d.getDay();
    if(wd!==0 && wd!==6) out.push(iso(d));
    d.setDate(d.getDate()-1);
  }
  return out.reverse();
}
function nextBusinessDay(afterStr){
  const d=new Date(afterStr+'T12:00:00');
  do{ d.setDate(d.getDate()+1); }while(d.getDay()===0||d.getDay()===6);
  return iso(d);
}
function lastBusinessDate(){
  const d=new Date(); d.setHours(12,0,0,0);
  while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()-1);
  return iso(d);
}
// Drift anual interpolado por tramos ("regímenes" de mercado por ticker)
function driftAt(drifts, frac){
  for(const seg of drifts) if(frac<=seg.until) return seg.d;
  return drifts[drifts.length-1].d;
}

/* Simulación de 12 meses (252 ruedas) para un ticker.
   Modelo: retorno diario = drift/252 + σ/√252·z + momentum leve.
   Los "regímenes" generan tendencias y quiebres reales → los cruces
   de medias móviles tienen sentido pedagógico (no es ruido puro). */
function simulateSeries(t, endDate){
  const rng  = mulberry32(SEED_BASE + hashStr(t.symbol));
  const days = businessDaysBack(252, endDate);
  let price = t.p0 * (0.97 + rng()*0.06);
  let prevR = 0;
  return days.map((d,i)=>{
    const drift = driftAt(t.drifts, i/days.length);
    const r = drift/252 + (t.vol/Math.sqrt(252))*gauss(rng) + 0.10*prevR;
    prevR = r;
    price = Math.max(0.5, price*(1+r));
    // el volumen "reacciona" al movimiento del día (más acción, más volumen)
    const v = Math.round(t.vBase * (0.6+rng()*0.9) * (1+4*Math.abs(r)));
    return {d, c:+price.toFixed(2), v};
  });
}

/* Jornada adicional (la que dispararía el cron de n8n cada día).
   También es determinista: la N-ésima jornada simulada es siempre la misma. */
function simulateNextDay(t, series){
  const rng  = mulberry32(SEED_BASE + hashStr(t.symbol)*31 + series.length*977);
  const last = series[series.length-1];
  const prevR = last.c/series[series.length-2].c - 1;
  const drift = driftAt(t.drifts, 1); // después del primer año: último régimen
  const r = drift/252 + (t.vol/Math.sqrt(252))*gauss(rng) + 0.10*prevR;
  const c = Math.max(0.5, last.c*(1+r));
  const v = Math.round(t.vBase*(0.6+rng()*0.9)*(1+4*Math.abs(r)));
  return {d:nextBusinessDay(last.d), c:+c.toFixed(2), v};
}

/* ================================================================
   2) BASE DE DATOS — persistencia en localStorage
   (juega el papel de SQLite/Postgres: sobrevive recargas del navegador)
   ================================================================ */

const DB_KEY = 'finlab_db_v1';
const DB = {
  load(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d && d.series && d.series.AAPL && d.series.AAPL.length>50) return d;
      }
    }catch(e){ /* DB corrupta → regenerar */ }
    const fresh = seedDatabase();
    DB.save(fresh);
    return fresh;
  },
  save(d){ try{ localStorage.setItem(DB_KEY, JSON.stringify(d)); }catch(e){} },
  reset(){ localStorage.removeItem(DB_KEY); return DB.load(); }
};
function seedDatabase(){
  const end = lastBusinessDate();
  const series = {};
  TICKERS.forEach(t => series[t.symbol] = simulateSeries(t, end));
  return {
    v:1, seed:SEED_BASE,
    end_date:end, sessions:252, refresh_count:0,
    series, alerts:[]
  };
}

/* ================================================================
   3) CÁLCULO FINANCIERO — indicadores y estadística de carteras
   ================================================================ */

// Media móvil simple de n ruedas (null hasta tener datos suficientes)
function sma(a,n){
  const out=Array(a.length).fill(null); let s=0;
  for(let i=0;i<a.length;i++){
    s+=a[i]; if(i>=n) s-=a[i-n];
    if(i>=n-1) out[i]=s/n;
  }
  return out;
}
// Media móvil exponencial (arranca con la SMA de los primeros n)
function ema(a,n){
  const out=Array(a.length).fill(null); const k=2/(n+1); let e=null;
  for(let i=0;i<a.length;i++){
    if(i===n-1){ let s=0; for(let j=0;j<n;j++)s+=a[j]; e=s/n; out[i]=e; }
    else if(i>=n){ e=a[i]*k+e*(1-k); out[i]=e; }
  }
  return out;
}
// RSI de Wilder (14 ruedas por defecto) — sobreprecios → 0..100
function rsiCalc(c,n=14){
  const out=Array(c.length).fill(null); let g=0,l=0;
  for(let i=1;i<c.length;i++){
    const d=c[i]-c[i-1], up=Math.max(d,0), dn=Math.max(-d,0);
    if(i<=n){
      g+=up; l+=dn;
      if(i===n){ g/=n; l/=n; out[i]= l===0?100:100-100/(1+g/l); }
    }else{
      g=(g*(n-1)+up)/n; l=(l*(n-1)+dn)/n;
      out[i]= l===0?100:100-100/(1+g/l);
    }
  }
  return out;
}
// Señal simple de tendencia por doble cruce (SMA + EMA)
function signalOf(s20,s50,e12,e26){
  const a = s20>s50, b = e12>e26;
  if(a&&b) return 'COMPRA';
  if(!a&&!b) return 'VENTA';
  return 'NEUTRAL';
}

/* Estado completo de mercado derivado de la DB.
   Es la ÚNICA fuente de verdad: la usan la UI y los endpoints /api. */
function buildMarket(db){
  const per = {};
  for(const t of TICKERS){
    const s   = db.series[t.symbol];
    const cl  = s.map(x=>x.c);
    const sma20=sma(cl,20), sma50=sma(cl,50), ema12=ema(cl,12), ema26=ema(cl,26), rsi14=rsiCalc(cl);
    const last=cl[cl.length-1], prev=cl[cl.length-2];
    const sig = signalOf(sma20.at(-1),sma50.at(-1),ema12.at(-1),ema26.at(-1));
    per[t.symbol]={
      symbol:t.symbol, name:t.name,
      dates:s.map(x=>x.d), closes:cl, vols:s.map(x=>x.v),
      sma20,sma50,ema12,ema26,rsi14,
      last, prev,
      chg:last-prev, chgPct:(last/prev-1)*100,
      vLast:s.at(-1).v,
      rsiNow:rsi14.at(-1),
      hi52:Math.max(...cl), lo52:Math.min(...cl),
      spark:cl.slice(-40).map((v,i)=>({i,v})),
      chg40:(cl.at(-1)/cl.at(-41)-1)*100,
      signal:sig
    };
  }
  // Índice sintético FINLAB-8: los 8 activos igual-weighted, base 100
  const n=252+db.refresh_count;
  const idx=[100]; const prevIdx=[null];
  for(let i=1;i<n;i++){
    let r=0;
    for(const t of TICKERS){
      const c=db.series[t.symbol];
      if(i<c.length) r += (c[i].c/c[i-1].c-1)/TICKERS.length;
    }
    idx.push(idx[i-1]*(1+r));
    prevIdx.push(idx[i-1]);
  }
  const advancing = TICKERS.filter(t=>per[t.symbol].chgPct>0).length;
  return {
    per, index:{level:idx.at(-1), chgPct:(idx.at(-1)/idx.at(-2)-1)*100},
    breadth:{advancing, declining:TICKERS.length-advancing},
    session: db.series.AAPL.at(-1).d
  };
}

/* Análisis de cartera: pesos {SYM: w} → métricas, correlaciones,
   contribución al riesgo e historia comparada vs benchmark EW. */
const RF = 0.043; // tasa libre de riesgo simulada (TNA 4,3%)
function analyzePortfolio(db, weights){
  const syms = Object.keys(weights).filter(s=>(weights[s]||0)>0);
  if(syms.length===0) return null;
  const wSum = syms.reduce((a,s)=>a+weights[s],0);
  const w = Object.fromEntries(syms.map(s=>[s,weights[s]/wSum])); // normalizo
  const N = db.series[syms[0]].length-1;             // cantidad de retornos
  // matriz de retornos diarios simples (series alineadas por fecha)
  const R = syms.map(s=>{
    const c=db.series[s].map(x=>x.c), r=[];
    for(let i=1;i<c.length;i++) r.push(c[i]/c[i-1]-1);
    return r;
  });
  const mean = R.map(r=>r.reduce((a,b)=>a+b,0)/N);
  const cov = R.map((_,i)=>R.map((__,j)=>{
    let s=0;
    for(let k=0;k<N;k++) s+=(R[i][k]-mean[i])*(R[j][k]-mean[j]);
    return s/(N-1);
  }));
  const ann = x=>x*252, sq = x=>Math.sqrt(x);
  const expRet  = syms.reduce((a,s,i)=>a+w[s]*ann(mean[i]),0);
  let varP=0;
  syms.forEach((s,i)=>syms.forEach((t,j)=>{ varP+=w[s]*w[t]*ann(cov[i][j]); }));
  const volP = sq(varP);
  const sharpe = (expRet-RF)/volP;
  // correlaciones (solo pares i<j, matriz completa para el heatmap)
  const corr = syms.map((_,i)=>syms.map((__,j)=>cov[i][j]/sq(cov[i][i]*cov[j][j])));
  // contribución al riesgo: RC_i = w_i · (Σw)_i ; Σ RC_i = σ_p
  const contrib = syms.map((s,i)=>{
    const marginal = syms.reduce((a,t,j)=>a+w[t]*ann(cov[i][j]),0);
    return {symbol:s, weight:w[s], expContrib:w[s]*ann(mean[i]), rc:w[s]*marginal};
  });
  const rcTot = contrib.reduce((a,c)=>a+c.rc,0);
  contrib.forEach(c=>c.pct=c.rc/rcTot);
  // historia: cartera vs benchmark igual-weighted, base 100
  const hist=[]; let p=100,b=100;
  const dates = db.series[syms[0]].map(x=>x.d);
  hist.push({d:dates[0],p:100,b:100});
  for(let k=0;k<N;k++){
    let rp=0, rb=0;
    syms.forEach((s,i)=>{ rp+=w[s]*R[i][k]; rb+=R[i][k]/syms.length; });
    p*=1+rp; b*=1+rb;
    hist.push({d:dates[k+1],p,b});
  }
  const offDiag=[];
  for(let i=0;i<syms.length;i++)for(let j=i+1;j<syms.length;j++)offDiag.push(corr[i][j]);
  const avgCorr = offDiag.length? offDiag.reduce((a,b)=>a+b,0)/offDiag.length : 1;
  return {syms,w,expRet,volP,sharpe,rf:RF,corr,contrib,hist,avgCorr,nObs:N};
}

/* Evaluación de reglas de alerta contra el último dato de la DB */
function evaluateAlerts(db){
  const m=buildMarket(db);
  return db.alerts.map(a=>{
    const p=m.per[a.ticker];
    let current, triggered=false;
    if(a.condition.startsWith('PRECIO')){ current=p.last; triggered = a.condition==='PRECIO_MENOR_QUE'? current<a.threshold : current>a.threshold; }
    else { current=p.rsiNow; triggered = a.condition==='RSI_MENOR_QUE'? current<a.threshold : current>a.threshold; }
    return {...a, current_value:+current.toFixed(2), triggered};
  });
}

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    // fallback para contextos sin Clipboard API (ej. file://)
    const ta=document.createElement('textarea');
    ta.value=txt; document.body.appendChild(ta); ta.select();

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Resaltado ligero de Python (strings → comentarios → keywords → números)
function hlPy(code){
  const re=/("[^"\n]*"|'[^'\n]*')|(#[^\n]*)|\b(import|from|as|def|return|for|in|if|elif|else|while|with|not|and|or|None|True|False|lambda|print|class|try|except)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    if(m[1])out+=`<span class="tk-s">${esc(m[1])}</span>`;
    else if(m[2])out+=`<span class="tk-c">${esc(m[2])}</span>`;
    else if(m[3])out+=`<span class="tk-k">${m[3]}</span>`;
    else out+=`<span class="tk-n">${m[4]}</span>`;
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}
// Resaltado ligero de JSON (claves ámbar, strings verdes, números teal)
function hlJson(str){
  const re=/("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let out='',last=0,m;
  while((m=re.exec(str))){
    out+=esc(str.slice(last,m.index));
    if(m[1])out+= m[2]? `<span class="tk-jk">${esc(m[1])}</span>${m[2]}` : `<span class="tk-s">${esc(m[1])}</span>`;
    else if(m[3])out+=`<span class="tk-jb">${m[3]}</span>`;
    else out+=`<span class="tk-n">${m[4]}</span>`;
    last=re.lastIndex;
  }
  return out+esc(str.slice(last));
}

  return <div className="toasts">
    {list.map(t=>(
      <div key={t.id} className={`toast ${t.type}`}>
        <Icon n={t.type==='err'?'alert':'check'} s={14}/>
        <span>{t.msg}</span>
      </div>
    ))}
  </div>;
}

/* --- Cinta de precios del header --- */
function TickerTape({mkt}){
  const items = TICKERS.map(t=>{
    const p=mkt.per[t.symbol];
    return {s:t.symbol, p:p.last, c:p.chgPct};
  });
  const row = (k)=>(
    <span key={k} style={{display:'flex'}}>
      {items.map((it,i)=>(
        <span className="tape-item" key={i}>
          <span className="ti-sym">{it.s}</span>
          <span className="ti-px">{fmtP(it.p)}</span>
          <span className={`ti-chg ${clsChg(it.c)}`}>{fmtPct(it.c)}</span>
        </span>
      ))}
    </span>
  );
  // contenido duplicado → loop infinito sin cortes
  return <div className="tape"><div className="tape-track">{row(1)}{row(2)}</div></div>;
}

/* --- Tooltip de Recharts con estética de terminal --- */
function TT({active,payload,label,dec=2}){
  if(!active||!payload||!payload.length)return null;
  const rows=payload.filter(p=>p.value!=null);
  return <div className="tt">
    <div className="tt-l">{fmtDateL(label).toUpperCase()}</div>
    {rows.map(p=>(
      <div className="tt-r" key={p.dataKey}>
        <span className="tt-k"><span style={{color:p.color}}>— </span>{p.name}</span>
        <span className="tt-v">{typeof p.value==='number'?nf2.format(p.value):p.value}</span>
      </div>
    ))}
  </div>;
}

/* --- Sparkline: mini gráfico de 40 ruedas sin ejes --- */
const Sparkline=React.memo(function Sparkline({data,color}){
  return (
    <ResponsiveContainer width="100%" height={28}>
      <LineChart data={data} margin={{top:2,bottom:2,left:0,right:0}}>
        <Line dataKey="v" stroke={color} strokeWidth={1.3} dot={false} isAnimationActive={false}/>
      </LineChart>
    </ResponsiveContainer>
  );
});

/* ---------- SECCIÓN 2 · ANÁLISIS DE CARTERAS ---------- */
const PRESETS={
  Conservadora:{label:'Conservadora',desc:'defensiva · baja volatilidad',w:{JNJ:.30,KO:.25,PG:.25,MSFT:.20}},
  Moderada:{label:'Moderada',desc:'equilibrada · diversificada',w:{AAPL:.20,MSFT:.20,KO:.15,JNJ:.15,GGAL:.15,PG:.15}},
  Agresiva:{label:'Agresiva',desc:'retorno máximo · alta volatilidad',w:{GGAL:.30,YPF:.25,PAM:.20,AAPL:.15,MSFT:.10}},
};
function PortfolioSection({db,goApi}){
  const [weights,setWeights]=useState({...PRESETS.Moderada.w});
  const [preset,setPreset]=useState('Moderada');
  const setW=(s,v)=>{ setPreset('Personalizada'); setWeights(w=>({...w,[s]:Math.max(0,v||0)})); };
  const toggle=(s,on)=>{ setPreset('Personalizada'); setWeights(w=>{
    const n={...w}; if(on)n[s]=n[s]>0?n[s]:0.10; else delete n[s]; return n; });
  };
  const applyPreset=k=>{ setWeights({...PRESETS[k].w}); setPreset(k); };
  const syms=Object.keys(weights).filter(s=>weights[s]>0).sort();
  const wSum=syms.reduce((a,s)=>a+weights[s],0);
  // el análisis SIEMPRE usa pesos normalizados (aunque el usuario no sume 100)
  const analysis=useMemo(()=>syms.length>=2?analyzePortfolio(db,weights):null,[db,weights,syms.length]);

  return <div>
    <div className="pf-grid">
      {/* ---- Constructor de cartera ---- */}
      <div className="panel">
        <div className="panel-h"><span className="panel-t">CONSTRUCTOR DE CARTERA</span>
          <span className="hint">{syms.length} activos</span></div>
        <div className="panel-b">
          <div className="preset-row">
            {Object.entries(PRESETS).map(([k,p])=>(
              <button key={k} className={`btn btn-sm ${preset===k?'on':''}`} onClick={()=>applyPreset(k)}
                title={p.desc}>{p.label}</button>
            ))}
          </div>
          <div className="hint" style={{marginBottom:10}}>
            {preset==='Personalizada'?'Cartera personalizada':PRESETS[preset].desc+' · preset "'+preset+'"'}
          </div>
          {TICKERS.map(t=>{
            const on=weights[t.symbol]>0;
            return (
              <div className="wrow" key={t.symbol}>
                <input type="checkbox" checked={on} onChange={e=>toggle(t.symbol,e.target.checked)}/>
                <span className="wr-sym">{t.symbol}</span>
                <span className="wr-name">{t.name}</span>
                <input type="number" step="0.05" min="0" value={on?weights[t.symbol]:''} disabled={!on}
                  onChange={e=>setW(t.symbol,parseFloat(e.target.value))}/>
              </div>
            );
          })}
          <div className={`wsum ${Math.abs(wSum-1)>0.005&&syms.length?'warn':''}`}>
            SUMA DE PESOS: {nf1.format(wSum*100)} %
            {Math.abs(wSum-1)>0.005&&syms.length? ' → se normalizan automáticamente para el cálculo':''}
          </div>
        </div>
      </div>

      {/* ---- Métricas + gráficos ---- */}
      <div style={{display:'flex',flexDirection:'column',gap:18}}>
        {!analysis ? (
          <div className="panel"><div className="empty">
            Elegí al menos 2 activos (o probá un preset) para calcular métricas.<br/>
            <span className="hint">la matriz de covarianzas necesita mínimo dos series</span>
          </div></div>
        ) : (
          <React.Fragment>
            {/* Banda de métricas principales */}
            <div className="statband">
              <div className="stat"><div className="stat-l">RETORNO ESPERADO (ANUALIZ.)</div>
                <div className="stat-v up">+{nf1.format(analysis.expRet*100)} %</div>
                <div className="stat-s">media diaria × 252 ruedas</div></div>
              <div className="stat"><div className="stat-l">VOLATILIDAD ANUALIZ.</div>
                <div className="stat-v">{nf1.format(analysis.volP*100)} %</div>
                <div className="stat-s">desvío estándar × √252</div></div>
              <div className="stat"><div className="stat-l">SHARPE RATIO</div>
                <div className="stat-v" style={{color:analysis.sharpe>1?'var(--up)':analysis.sharpe>0?'var(--amb)':'var(--dn)'}}>
                  {nf2.format(analysis.sharpe)}</div>
                <div className="stat-s">rf = {nf1.format(RF*100)} % TNA</div></div>
              <div className="stat"><div className="stat-l">CORRELACIÓN MEDIA</div>
                <div className="stat-v">{nf2.format(analysis.avgCorr)}</div>
                <div className="stat-s">entre pares de la cartera</div></div>
              <div className="stat"><div className="stat-l">OBSERVACIONES</div>
                <div className="stat-v">{analysis.nObs}</div>
                <div className="stat-s">ruedas · {analysis.syms.length} activos</div></div>
            </div>

            {/* Evolución comparada vs benchmark igual-weighted */}
            <div className="panel">
              <div className="panel-h"><span className="panel-t">EVOLUCIÓN · CARTERA vs BENCHMARK IGUAL-PONDERADO (BASE 100)</span></div>
              <div style={{padding:'12px 8px'}}>
                <ResponsiveContainer width="100%" height={280}>
                  <LineChart data={analysis.hist} margin={{top:8,right:8,left:0,bottom:0}}>
                    <CartesianGrid stroke="#17222D" vertical={false}/>
                    <XAxis dataKey="d" tick={{fill:'#54677A',fontSize:10,fontFamily:'JetBrains Mono'}}
                      tickFormatter={fmtDate} minTickGap={70} axisLine={{stroke:'#243242'}} tickLine={false}/>
                    <YAxis domain={['auto','auto']} width={54} orientation="right"
                      tick={{fill:'#54677A',fontSize:10,fontFamily:'JetBrains Mono'}} axisLine={false} tickLine={false}/>
                    <Tooltip content={<TT/>} cursor={{stroke:'#2A3B4C'}}/>
                    <ReferenceLine y={100} stroke="#2A3B4C"/>
                    <Line dataKey="b" name="Benchmark EW" stroke="#7E8FA0" strokeWidth={1.2} dot={false}
                      strokeDasharray="4 3" isAnimationActive={false}/>
                    <Line dataKey="p" name="Mi cartera" stroke="#FFB020" strokeWidth={1.8} dot={false} isAnimationActive={false}/>
                  </LineChart>
                </ResponsiveContainer>
                <div className="hint" style={{padding:'2px 8px 6px'}}>
                  Cartera final: <b style={{color:'var(--amb)'}}>{nf1.format(analysis.hist.at(-1).p-100>0?'+':'')}{nf1.format(analysis.hist.at(-1).p-100)} %</b>
                  {' '}· Benchmark final: <b>{nf1.format(analysis.hist.at(-1).b-100>0?'+':'')}{nf1.format(analysis.hist.at(-1).b-100)} %</b>
                  {' '}· metodología: pesos constantes con rebalanceo diario
                </div>
              </div>
            </div>

            {/* Matriz de correlación */}
            <div className="panel">
              <div className="panel-h"><span className="panel-t">MATRIZ DE CORRELACIÓN · RETORNOS DIARIOS</span></div>
              <div style={{overflowX:'auto',padding:'8px 10px 12px'}}>
                <table style={{width:'auto',minWidth:'100%'}}>
                  <thead><tr><th></th>{analysis.syms.map(s=><th key={s} className="corr-th">{s}</th>)}</tr></thead>
                  <tbody>
                  {analysis.syms.map((s,i)=>(
                    <tr key={s}>
                      <td style={{fontWeight:700,fontSize:11}}>{s}</td>
                      {analysis.syms.map((t,j)=>{
                        const v=analysis.corr[i][j];
                        const bg = i===j ? 'rgba(255,176,32,.10)'
                          : v>=0 ? `rgba(46,189,133,${(Math.abs(v)*.42).toFixed(2)})`
                                 : `rgba(246,70,93,${(Math.abs(v)*.42).toFixed(2)})`;
                        return <td key={t} className="corr-cell mono-num" style={{background:bg}}>
                          {nf2.format(v)}</td>;
                      })}
                    </tr>
                  ))}
                  </tbody>
                </table>
                <div className="hint" style={{paddingadding:0,marginTop:6}}>
                  Verde = se mueven juntos · Rojo = se mueven opuestos · Cerca de 0 = diversificación efectiva.
                </div>
              </div>
            </div>

            {/* Contribución al riesgo */}
            <div className="panel">
              <div className="panel-h"><span className="panel-t">CONTRIBUCIÓN AL RIESGO POR ACTIVO</span>
                <span className="hint">Σ aportes = σ de la cartera</span></div>
              <table>
                <thead><tr><th>ACTIVO</th><th>PESO</th><th>APORTE AL RETORNO</th><th>CONTRIB. RIESGO (σ)</th><th style={{width:120}}>% DEL RIESGO</th></tr></thead>
                <tbody>
                {analysis.contrib.slice().sort((a,b)=>b.pct-a.pct).map(c=>(
                  <tr key={c.symbol}>
                    <td><b>{c.symbol}</b> <span style={{color:'var(--dim)',fontSize:10}}>{T_BY_SYM[c.symbol].name}</span></td>
                    <td className="mono-num">{nf1.format(c.weight*100)} %</td>
                    <td className={`mono-num ${clsChg(c.expContrib)}`}>{(c.expContrib>=0?'+':'')+nf1.format(c.expContrib*100)} %</td>
                    <td className="mono-num">{nf2.format(c.rc*100)} %</td>
                    <td><div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'flex-end'}}>
                      <span className="mono-num">{nf1.format(c.pct*100)} %</span>
                      <div className="rcbar"><i style={{width:(c.pct*100).toFixed(1)+'%'}}/></div>
                    </div></td>
                  </tr>
                ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  </div>;
}

/* ---------- SECCIÓN 3 · INTRO A PYTHON Y COLAB ---------- */
function CodeBox({title,code,lang='py',onCopy}){
  const [copied,setCopied]=useState(false);
  const doCopy=async()=>{
    const ok=await copyText(code);
    if(ok){ setCopied(true); onCopy&&onCopy(); setTimeout(()=>setCopied(false),1800); }
  };
  return (
    <div className="codebox">
      <div className="codebox-h">
        <span className="codebox-t"><Icon n="code" s={13}/>{title}</span>
        <div className="acts">
          <button className="btn btn-sm" onClick={doCopy}>
            <Icon n={copied?'check':'copy'} s={12}/>{copied?'COPIADO':'COPIAR CÓDIGO'}
          </button>
          <a className="btn btn-sm" href="https://colab.research.google.com/" target="_blank" rel="noreferrer">
            <Icon n="ext" s={12}/>ABRIR EN COLAB
          </a>
        </div>
      </div>
      <pre>
        {code.split('\n').map((ln,i)=>(
          <div className="cl" key={i}>
            <span className="cln">{i+1}</span>
            <span dangerouslySetInnerHTML={{__html: lang==='py'? (hlPy(ln)||'&nbsp;') : (hlJson(ln)||'&nbsp;')}}/>
          </div>
        ))}
      </pre>
    </div>
  );
}

/* ---------- ASISTENTE · CREAR UNA AUTOMATIZACIÓN SIN CÓDIGO ---------- */
function buildN8nWorkflow(signal){
  const sourceCode=`const market = [
  { ticker: "AAPL", signal: "COMPRA", variation: 0.8 },
  { ticker: "GGAL", signal: "NEUTRAL", variation: 0.5 },
  { ticker: "YPF", signal: "VENTA", variation: -1.2 }
];

const matches = market.filter(item => item.signal === "${signal}");
return [{ json: {
  condition: "${signal}",
  hasSignal: matches.length > 0,
  matches,
  message: matches.length
    ? "Se encontraron " + matches.length + " señales ${signal}."
    : "No se encontraron señales ${signal}."
} }];`;
  const branchCode=(result)=>`return $input.all().map(({ json }) => ({
  json: { ...json, result: "${result}" }
}));`;
  return {
    name:`Monitor de mercado - señal ${signal} (prueba)`,
    nodes:[
      {parameters:{},id:'2bc79111-7413-4a5a-b4c8-7e7821365bd1',name:'Iniciar prueba',type:'n8n-nodes-base.manualTrigger',typeVersion:1,position:[240,300]},
      {parameters:{mode:'runOnceForAllItems',language:'javaScript',jsCode:sourceCode},id:'947fbe26-718f-4621-92a6-618b387f31c1',name:'Revisar datos de ejemplo',type:'n8n-nodes-base.code',typeVersion:2,position:[460,300]},
      {parameters:{conditions:{options:{caseSensitive:true,leftValue:'',typeValidation:'strict',version:2},conditions:[{id:'c7ab28ac-1a44-4f6a-a883-3b77d82ddf17',leftValue:'={{ $json.hasSignal }}',rightValue:true,operator:{type:'boolean',operation:'true',singleValue:true}}],combinator:'and'},options:{}},id:'6d7d53e8-8c71-4d20-b51d-cfae7871b274',name:'¿Hay una señal?',type:'n8n-nodes-base.if',typeVersion:2.2,position:[700,300]},
      {parameters:{mode:'runOnceForAllItems',language:'javaScript',jsCode:branchCode('AVISO DE PRUEBA')},id:'36c4bdb6-2b96-41f8-843c-0ad6a9286104',name:'Preparar aviso de prueba',type:'n8n-nodes-base.code',typeVersion:2,position:[940,200]},
      {parameters:{mode:'runOnceForAllItems',language:'javaScript',jsCode:branchCode('SIN COINCIDENCIAS')},id:'e16f1a50-c70b-4b7e-a586-99b8f5362109',name:'Registrar que no hubo señal',type:'n8n-nodes-base.code',typeVersion:2,position:[940,400]}
    ],
    connections:{
      'Iniciar prueba':{main:[[{node:'Revisar datos de ejemplo',type:'main',index:0}]]},
      'Revisar datos de ejemplo':{main:[[{node:'¿Hay una señal?',type:'main',index:0}]]},
      '¿Hay una señal?':{main:[[{node:'Preparar aviso de prueba',type:'main',index:0}],[{node:'Registrar que no hubo señal',type:'main',index:0}]]}
    },
    active:false,settings:{executionOrder:'v1'},pinData:{},tags:[]
  };
}

function GroupExercises({signal}){
  const [responses,setResponses]=useState({});
  const [checked,setChecked]=useState({});
  const score=TEAM_EXERCISES.filter(ex=>checked[ex.id]&&responses[ex.id]===(ex.answerForSignal?ex.answerForSignal[signal]:ex.answer)).length;
  const setResponse=(id,value)=>{
    setResponses(prev=>({...prev,[id]:value}));
    setChecked(prev=>({...prev,[id]:false}));
  };
  return (
    <section className="group-lab" aria-labelledby="group-lab-title">
      <div className="group-lab-head">
        <div><h3 id="group-lab-title">Pónganlo a prueba en equipo</h3>
          <p>Armen grupos de 3 o 4. Antes de mirar las respuestas, conversen y acuerden una opción. Una persona puede manejar la página y otra explicar el porqué.</p></div>
        <span className="group-time">15 MIN · {score}/3 RESUELTOS</span>
      </div>
      <div className="group-roles" aria-label="Roles sugeridos para el grupo">
        <div className="group-role"><b>Coordina</b><span>Lee la consigna y reparte turnos para opinar.</span></div>
        <div className="group-role"><b>Sigue el flujo</b><span>Señala en qué paso se encuentra la automatización.</span></div>
        <div className="group-role"><b>Opera n8n</b><span>Prueba el JSON importado cuando el grupo acuerda.</span></div>
        <div className="group-role"><b>Relata</b><span>Resume qué aprendieron y qué falta para producción.</span></div>
      </div>
      <div className="exercise-list">
        {TEAM_EXERCISES.map((ex,index)=>{
          const expected=ex.answerForSignal?ex.answerForSignal[signal]:ex.answer;
          const isCorrect=responses[ex.id]===expected;
          return (
            <article className="exercise" key={ex.id}>
              <div className="exercise-title"><span className="exercise-n">0{index+1}</span><div>
                <h4>{ex.title}</h4><p>{ex.time}</p>
              </div></div>
              <div className="exercise-task">
                <label htmlFor={'exercise-'+ex.id}>{ex.prompt}</label>
                <div className="exercise-controls">
                  <select id={'exercise-'+ex.id} value={responses[ex.id]||''} onChange={e=>setResponse(ex.id,e.target.value)}>
                    <option value="" disabled>Elijan una respuesta</option>
                    {ex.options.map(([value,label])=><option key={value} value={value}>{label}</option>)}
                  </select>
                  <button className="btn btn-sm" onClick={()=>setChecked(prev=>({...prev,[ex.id]:true}))} disabled={!responses[ex.id]}>COMPROBAR</button>
                </div>
                {checked[ex.id]&&<div className={`exercise-feedback ${isCorrect?'good':'retry'}`} role="status">
                  <b>{isCorrect?'¡Bien razonado!':'Vuelvan a conversarlo.'}</b> {isCorrect?ex.explain:'Pista: revisen el orden dibujado arriba y la nota de límite de esta prueba.'}
                </div>}
              </div>
            </article>
          );
        })}
      </div>
    </section>
  );
}

    "risk_free_rate": 0.043,
    "avg_correlation": 0.214,
    "observations": 252,
    "risk_contribution": [
      { "symbol": "GGAL", "weight": 0.4, "rc_vol": 0.1591, "rc_pct": 0.586 }
    ],
    "history_sample": [
      { "date": "2024-05-13", "portfolio": 100.0, "benchmark": 100.0 }
    ]
  },
  "meta": { "weights_normalized": false }
}`;
  const exRefresh=`{
  "ok": true,
  "data": {
    "new_session": "2025-05-13",
    "sessions_total": 253,
    "index": { "level": 129.20, "change_pct": 0.62 },
    "alerts_triggered": ["al_m1x9z4"]
  },
  "meta": { "refresh_count": 1 }
}`;
  const exAlert=`{
  "ok": true,
  "data": {
    "id": "al_m1x9z4",
    "ticker": "GGAL",
    "condition": "RSI_MENOR_QUE",
    "threshold": 30,
    "note": "sobreventa — sumar a la cartera",
    "created_at": "2025-05-13T18:02:10Z",
    "status": "created",
    "current_value": 58.2,
    "triggered": false
  }
}`;
  return (
    <div className="doc-body">
      <div className="sec-head">
        <div className="sec-num">API</div>
        <div><h2>Especificación de la API</h2>
        <p>Contrato REST completo expuesto por el backend de FIN·LAB. Respuestas JSON puras y estructuradas,
        pensadas para consumirse desde n8n (nodo <b>HTTP Request</b> o <b>Webhook</b>), scripts de Python o cualquier cliente HTTP.
        En esta demo el backend corre embebido en la página; el snippet del final muestra el equivalente real en FastAPI.</p></div>
      </div>

      <div className="doc-sec">
        <h3><span className="k">GENERAL</span>Convenciones</h3>
        <ul>
          <li>Base URL (backend desplegado): <code>http://localhost:8000</code> · esta demo: consola de la sección <a href="#/api">API &amp; Alertas</a>.</li>
          <li>Toda respuesta exitosa: <code>{'{"ok": true, "generated_at": "...", "data": {...}, "meta": {...}}'}</code>.</li>
          <li>Toda respuesta de error: <code>{'{"ok": false, "error": "mensaje", "status": 400}'}</code> con el código HTTP correspondiente.</li>
          <li>Sin autenticación (demo educativa). En producción: API key por header <code>X-API-Key</code>.</li>
          <li>Códigos: <code>200</code> OK · <code>201</code> creado · <code>400</code> parámetros inválidos · <code>404</code> ruta o recurso inexistente.</li>
        </ul>
      </div>

      <div className="doc-sec">
        <h3><span className="k">GET</span>/api/market/summary</h3>
        <p>Resumen de mercado de los 8 tickers con señales técnicas. Sin parámetros.</p>
        <table className="param-tbl"><thead><tr><th>CAMPO (data)</th><th>TIPO</th><th>DESCRIPCIÓN</th></tr></thead>
        <tbody>
          <tr><td><code>index.level / change_pct</code></td><td>number</td><td>Índice sintético FINLAB-8 (igual-ponderado, base 100) y variación diaria.</td></tr>
          <tr><td><code>breadth.advancing / declining</code></td><td>int</td><td>Cantidad de activos que suben / bajan en la sesión.</td></tr>
          <tr><td><code>tickers[]</code></td><td>array</td><td>Por activo: <code>last, change, change_pct, volume, rsi14, sma20, sma50, signal</code>.</td></tr>
          <tr><td><code>tickers[].signal</code></td><td>string</td><td><code>COMPRA</code> · <code>VENTA</code> · <code>NEUTRAL</code> (doble cruce SMA20/50 + EMA12/26).</td></tr>
        </tbody></table>
        <div className="curl" style={{marginTop:10}}>{curlBase}/api/market/summary</div>
        <div style={{marginTop:10}}><CodeBox title="RESPUESTA DE EJEMPLO (RECORTADA)" code={exSummary} lang="json" onCopy={()=>notify('Ejemplo copiado')}/></div>
      </div>

      <div className="doc-sec">
        <h3><span className="k">GET</span>/api/portfolio/analyze</h3>
        <p>Analiza una cartera ad-hoc sin persistirla.</p>
        <table className="param-tbl"><thead><tr><th>PARÁMETRO</th><th>TIPO</th><th>DESCRIPCIÓN</th></tr></thead>
        <tbody>
          <tr><td><code>tickers</code></td><td>string (query)</td><td>Lista separada por comas. Mínimo 2. Ej: <code>GGAL,YPF,AAPL</code>.</td></tr>
          <tr><td><code>weights</code></td><td>string (query)</td><td>Pesos separados por comas, misma cantidad que tickers. Si no suman 1 se normalizan (<code>meta.weights_normalized = true</code>).</td></tr>
        </tbody></table>
        <div className="curl" style={{marginTop:10}}>{`curl "http://localhost:8000/api/portfolio/analyze?tickers=AAPL,MSFT&weights=0.5,0.5"`}</div>
        <div style={{marginTop:10}}><CodeBox title="RESPUESTA DE EJEMPLO (RECORTADA)" code={exPortfolio} lang="json" onCopy={()=>notify('Ejemplo copiado')}/></div>
        <p style={{marginTop:8}}><b>Nota:</b> <code>history_sample</code> devuelve ~24 puntos muestreados para legibilidad; todas las métricas se calculan sobre los 252 días completos.</p>
      </div>

      <div className="doc-sec">
        <h3><span className="k">POST</span>/api/market/refresh</h3>
        <p>Regenera y persiste una nueva jornada de precios para los 8 activos (simula la ejecución programada diaria, como un cron de n8n). Sin body. Re-evalúa todas las reglas de alerta y devuelve las disparadas.</p>
        <div className="curl" style={{marginTop:10}}>{`${curlBase} -X POST /api/market/refresh`}</div>
        <div style={{marginTop:10}}><CodeBox title="RESPUESTA DE EJEMPLO" code={exRefresh} lang="json" onCopy={()=>notify('Ejemplo copiado')}/></div>
      </div>

      <div className="doc-sec">
        <h3><span className="k">POST</span>/api/alerts &nbsp;·&nbsp; <span className="k">GET</span>/api/alerts &nbsp;·&nbsp; <span className="k">DELETE</span>/api/alerts/:id</h3>
        <p>Ciclo completo de reglas de alerta sobre la base de datos.</p>
        <table className="param-tbl"><thead><tr><th>CAMPO (body)</th><th>TIPO</th><th>DESCRIPCIÓN</th></tr></thead>
        <tbody>
          <tr><td><code>ticker</code></td><td>string</td><td>Uno de: AAPL, MSFT, JNJ, KO, PG, GGAL, YPF, PAM.</td></tr>
          <tr><td><code>condition</code></td><td>enum</td><td><code>PRECIO_MENOR_QUE</code> · <code>PRECIO_MAYOR_QUE</code> · <code>RSI_MENOR_QUE</code> · <code>RSI_MAYOR_QUE</code>.</td></tr>
          <tr><td><code>threshold</code></td><td>number</td><td>Umbral de comparación (precio en USD o nivel de RSI 0–100).</td></tr>
          <tr><td><code>note</code></td><td>string?</td><td>Opcional. Nota libre para el operador.</td></tr>
        </tbody></table>
        <div className="curl" style={{marginTop:10}}>{`${curlBase} -X POST /api/alerts \\
  -H "Content-Type: application/json" \\
  -d '{"ticker":"GGAL","condition":"RSI_MENOR_QUE","threshold":30}'`}</div>
        <div style={{marginTop:10}}><CodeBox title="RESPUESTA DE EJEMPLO (201 CREATED)" code={exAlert} lang="json" onCopy={()=>notify('Ejemplo copiado')}/></div>
      </div>

      <div className="doc-sec">
        <h3><span className="k">N8N</span>Receta de automatización</h3>
        <ol>
          <li><b>Schedule Trigger</b> — todos los días a las 18:00 (cierre de sesión simulada).</li>
          <li><b>HTTP Request</b> — <code>POST /api/market/refresh</code> → llega la nueva jornada.</li>
          <li><b>HTTP Request</b> — <code>GET /api/market/summary</code> → señales de todos los activos.</li>
          <li><b>IF</b> — condición: alguna <code>signal === "VENTA"</code> o <code>alerts_triggered</code> no vacío.</li>
          <li><b>Rama true</b> → nodo Slack / Google Sheets / Gmail con el resumen.</li>
          <li><b>Rama false</b> → log silencioso en Sheets (auditoría de cada corrida).</li>
        </ol>
        <p style={{marginTop:8}}>En un despliegue real, el backend se expone con dominio propio (o <code>ngrok</code> para pruebas locales)
        y n8n consume esa URL con el nodo HTTP Request — exactamente los mismos contratos de esta página.</p>
      </div>

      <div className="doc-sec">
        <h3><span className="k">APÉNDICE</span>El backend real (FastAPI + SQLite)</h3>
        <p style={{marginBottom:10}}>Esta demo embebe el servidor en el navegador para poder proyectarla sin instalaciones.
        El código real equivalente es casi textual:</p>
        <CodeBox title="main.py · BACKEND REAL EQUIVALENTE" code={FASTAPI_SNIPPET} onCopy={()=>notify('Snippet FastAPI copiado')}/>
      </div>

      <a href="#/api" className="btn" style={{marginTop:6}}><Icon n="play" s={12}/>PROBAR LOS ENDPOINTS EN LA CONSOLA</a>
    </div>
  );
}

/* ================================================================
   8) APP PRINCIPAL — router por hash + estado global
   ================================================================ */
const PAGES=[['guiado','EMPEZAR'],['mercado','01 · MERCADO'],['carteras','02 · CARTERAS'],['python','03 · PYTHON & COLAB'],['api','04 · API & ALERTAS'],['docs','DOCS']];
function SectionHead({n,t,d}){return (
  <div className="sec-head">
    <div className="sec-num">{n}</div>
    <div><h2>{t}</h2><p>{d}</p></div>
  </div>
);}

function App(){
  // router mínimo por hash (#/mercado, #/docs, …)
  const [page,setPage]=useState(()=>(location.hash.replace('#/','')||'guiado'));
  const [theme,setTheme]=useState(()=>{
    try{return localStorage.getItem('finlab_theme')==='light'?'light':'dark';}catch(e){return 'dark';}
  });
  useEffect(()=>{
    document.documentElement.dataset.theme=theme;
    try{localStorage.setItem('finlab_theme',theme);}catch(e){}
  },[theme]);
  useEffect(()=>{
    const h=()=>{ setPage(location.hash.replace('#/','')||'guiado'); window.scrollTo(0,0); };
    addEventListener('hashchange',h);
    return ()=>removeEventListener('hashchange',h);
  },[]);
  // "conexión a la base de datos": snapshot del store persistido
  const [db,setDb]=useState(()=>DB.load());
  const [toasts,setToasts]=useState([]);
  const [busy,setBusy]=useState(false);
  const [confirmReset,setConfirmReset]=useState(false);
  const [clock,setClock]=useState('');
  useEffect(()=>{
    const tick=()=>setClock(new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    tick(); const id=setInterval(tick,1000);
    return ()=>clearInterval(id);
  },[]);
  const notify=useCallback((msg,type='ok')=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3400);
  },[]);
  const reloadDb=()=>setDb(DB.load());
  const mkt=useMemo(()=>buildMarket(db),[db]);
  const alertsTriggered=useMemo(()=>evaluateAlerts(db).filter(a=>a.triggered).length,[db]);

  // POST /api/market/refresh desde el header o la sección mercado
  const doRefresh=async()=>{
    setBusy(true);
    const r=await api.request('POST','/api/market/refresh');
    reloadDb();
    setBusy(false);
    if(r.json.ok){
      const trig=r.json.data.alerts_triggered.length;
      notify(`Nueva jornada persistida: ${r.json.data.new_session} (${r.json.data.sessions_total} sesiones)${trig?` · ${trig} alerta(s) disparada(s)`:''}`, trig?'err':'ok');
    }
  };
  const doReset=()=>{
    if(!confirmReset){ setConfirmReset(true); setTimeout(()=>setConfirmReset(false),3200); return; }
    setConfirmReset(false);
    DB.reset(); reloadDb();
    notify('Base de datos regenerada con la semilla #42 — estado inicial reproducible');
  };

  return (
    <React.Fragment>
      {/* ===== Cabecera fija con cinta de precios ===== */}
      <header className="hd">
        <div className="hd-in">
          <div className="brand">
            <div className="brand-mark"><BrandMark/></div>
            <div>
              <div className="brand-name">FIN·LAB</div>
              <div className="brand-sub">IA APLICADA A FINANZAS · POSGRADO UNLP</div>
            </div>
          </div>
          <div className="hd-right">
            <button className="theme-btn" onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}
              aria-label={theme==='dark'?'Cambiar a tema claro':'Cambiar a tema oscuro'}
              title={theme==='dark'?'Cambiar a tema claro':'Cambiar a tema oscuro'}>
              <Icon n={theme==='dark'?'sun':'moon'} s={13}/>{theme==='dark'?'TEMA CLARO':'TEMA OSCURO'}
            </button>
            <div className="db-pill" title="Base de datos local (localStorage) · datos simulados deterministas">
              <span className="db-dot"/>DB · {db.series.AAPL.length} SESIONES · {TICKERS.length} ACTIVOS · SEMILLA #{db.seed}
            </div>
            <button className={`hd-btn ${confirmReset?'confirm':''}`} onClick={doReset}>
              <Icon n="rotate" s={12}/>{confirmReset?'¿CONFIRMAR?':'REINICIAR SEMILLA'}
            </button>
            <div className="clock"><Icon n="clock" s={12} style={{verticalAlign:'-2px',marginRight:6,color:'var(--dim)'}}/><b>{clock}</b></div>
          </div>
        </div>
        <TickerTape mkt={mkt}/>
        <nav className="nav">
          {PAGES.map(([k,l])=>(
            <a key={k} href={'#/'+k} className={page===k?'on':''}>
              {l}
              {k==='api'&&alertsTriggered>0&&<span className="nav-dot" title={alertsTriggered+' alerta(s) disparada(s)'}/>}
            </a>
          ))}
        </nav>
      </header>

      <main className="wrap">
        {page==='guiado'&&<GuidedAutomation notify={notify}/>}
        {page==='mercado'&&(
          <React.Fragment>
            <SectionHead n="01" t="Análisis de mercado"
              d="Ocho activos (EE.UU. + ADRs argentinos) con 12 meses de historia diaria simulada en el backend y persistida en base de datos. Elegí un ticker del panel para ver precio, SMA 20/50, EMA 12/26, RSI 14 y la señal de tendencia por doble cruce de medias."/>
            <MarketSection mkt={mkt} onRefresh={doRefresh} refreshing={busy}/>
          </React.Fragment>
        )}
        {page==='carteras'&&(
          <React.Fragment>
            <SectionHead n="02" t="Análisis de carteras"
              d="Construí una cartera activo por activo o cargá un preset. El backend calcula retorno esperado y volatilidad anualizados, Sharpe ratio, matriz de correlación, evolución contra benchmark igual-ponderado y cuánto riesgo aporta cada activo."/>
            <PortfolioSection db={db}/>
          </React.Fragment>
        )}
        {page==='python'&&(
          <React.Fragment>
            <SectionHead n="03" t="Intro a Python y Colab"
              d="Los cuatro bloques que reconstruyen todo lo que hace esta terminal, pero con código real: yfinance, pandas, matemática de carteras y llamadas a APIs. Cada bloque se copia con un clic y se ejecuta en Google Colab sin instalar nada."/>
            <PythonSection notify={notify}/>
          </React.Fragment>
        )}
        {page==='api'&&(
          <React.Fragment>
            <SectionHead n="04" t="API para automatización"
              d="Los mismos endpoints REST que consumiría un flujo de n8n (nodo HTTP Request), documentados y ejecutables desde esta consola. Incluye el gestor de reglas de alerta persistidas en base de datos, evaluadas en vivo contra la última sesión."/>
            <ApiSection db={db} mkt={mkt} notify={notify} onDbChange={reloadDb}/>
          </React.Fragment>
        )}
        {page==='docs'&&<DocsPage notify={notify}/>}

        <footer>
          FIN·LAB · material didáctico del posgrado de IA aplicada a Finanzas (UNLP) — clase: automatizaciones para análisis
          de mercado y carteras.<br/>
          Datos SIMULADOS con fines educativos (no constituyen asesoramiento financiero) · generación determinista con semilla #42 ·
          sin dependencias de API keys externas.
        </footer>
      </main>
      <Toasts list={toasts}/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
